<meta charset="utf-8">
<script>document.documentElement.classList.add("instant")</script>
<title>Olavi Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@200;300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Colours are tokens. The palette script sets them per week from the recipe book;
     these defaults are the dusk recipe, so the page still looks right if the script fails. */
  :root {
    color-scheme: dark;
    --ground: #0c0e12;
    --ink: #eef1f0;
    --ink-2: #b4bcbd;
    --ink-3: #7c8588;
    --fg: #ffffff;            /* hairlines and faint fills */
    --sink: #000000;          /* recessed wells */
    --glass: rgba(255, 255, 255, 0.055);
    --glass-hi: rgba(255, 255, 255, 0.10);
    --edge: rgba(255, 255, 255, 0.13);
    --highlight: rgba(255, 255, 255, 0.08);
    --shadow-color: rgba(0, 0, 0, 0.6);
    --blob-opacity: .75;
    --accent: #7ef2c1;
    --accent-2: #d9fff0;
    --warm: #ff7a45;
    --glow-1a: #ff8a4c; --glow-1b: #c2410c;
    --glow-2a: #1f6f5a; --glow-2b: #0f3b33;
    --glow-3: #6d6a86;
    --grey-top: #e3e4ea;
    --easy: #4fd8a0;
    --steady: #2f8a70;
    --grey: #8d90a0;
    --hard: #ff7a45;
    --race: #f3ece4;
    --warn: #ffc15e;
    --display: "Urbanist", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  /* Colour tokens are registered so a mode or week change blends every colour over 0.5s. */
  @property --ground { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --ink { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --ink-2 { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --ink-3 { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --fg { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --sink { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --glass { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --glass-hi { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --edge { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --highlight { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --shadow-color { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --accent { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --accent-2 { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --warm { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --glow-1a { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --glow-1b { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --glow-2a { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --glow-2b { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --glow-3 { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --grey-top { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --easy { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --steady { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --grey { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --hard { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --race { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --blob-opacity { syntax: "<number>"; inherits: true; initial-value: .75; }
  :root { transition: --ground .5s ease, --ink .5s ease, --ink-2 .5s ease, --ink-3 .5s ease, --fg .5s ease, --sink .5s ease, --glass .5s ease, --glass-hi .5s ease, --edge .5s ease, --highlight .5s ease, --shadow-color .5s ease, --accent .5s ease, --accent-2 .5s ease, --warm .5s ease, --glow-1a .5s ease, --glow-1b .5s ease, --glow-2a .5s ease, --glow-2b .5s ease, --glow-3 .5s ease, --grey-top .5s ease, --easy .5s ease, --steady .5s ease, --grey .5s ease, --hard .5s ease, --race .5s ease, --blob-opacity .5s ease; }
  :root.instant { transition: none; }
  @media (prefers-reduced-motion: reduce) { :root { transition: none; } }
  * { box-sizing: border-box; }
  html, body { background: var(--ground); }
  body {
    margin: 0;
    color: var(--ink);
    font-family: var(--display);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- atmosphere ---------- */
  .sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: var(--blob-opacity); }
  .b1 { width: 62vw; height: 62vw; right: -18vw; top: -22vw; background: radial-gradient(circle, var(--glow-1a) 0%, var(--glow-1b) 45%, transparent 70%); animation: drift1 38s ease-in-out infinite alternate; }
  .b2 { width: 55vw; height: 55vw; left: -20vw; bottom: -25vw; background: radial-gradient(circle, var(--glow-2a) 0%, var(--glow-2b) 50%, transparent 72%); animation: drift2 46s ease-in-out infinite alternate; }
  .b3 { width: 38vw; height: 38vw; left: 30vw; top: 30vh; background: radial-gradient(circle, var(--glow-3) 0%, transparent 70%); opacity: .35; animation: drift1 52s ease-in-out infinite alternate-reverse; }
  .streaks { position: absolute; inset: -10%; background:
      repeating-linear-gradient(97deg, transparent 0 38px, color-mix(in srgb, var(--fg) 1.8%, transparent) 38px 40px, transparent 40px 120px);
    filter: blur(2px); animation: slide 24s linear infinite; }
  .grain { position: absolute; inset: 0; opacity: .08; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' fill='%23ffffff'/></svg>"); }
  @keyframes drift1 { to { transform: translate(-8vw, 10vh) scale(1.12); } }
  @keyframes drift2 { to { transform: translate(10vw, -8vh) scale(1.08); } }
  @keyframes slide { to { transform: translateX(-120px); } }
  @media (prefers-reduced-motion: reduce) { .blob, .streaks { animation: none; } }

  /* ---------- frame ---------- */
  .wrap { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding-inline: 20px; padding-block: 22px 48px; display: grid; gap: 16px; }
  .glass {
    background: linear-gradient(160deg, var(--glass-hi), var(--glass) 55%);
    border: 1px solid var(--edge);
    border-radius: 22px;
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    box-shadow: inset 0 1px 0 var(--highlight), 0 30px 60px -30px var(--shadow-color);
    padding: 20px 22px;
    min-width: 0;
  }
  .label { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .q { font-size: 17px; font-weight: 500; margin: 0 0 2px; color: var(--ink); text-wrap: balance; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-3); }
  .soft { color: var(--ink-2); }

  header.bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 18px; border-radius: 999px; }
  .mark { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 19px; letter-spacing: -.01em; }
  .mark i { width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(from 200deg, var(--accent), var(--warm), var(--accent)); filter: blur(.3px); box-shadow: 0 0 18px color-mix(in srgb, var(--warm) 50%, transparent); }
  .pill { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--edge); background: color-mix(in srgb, var(--sink) 25%, transparent); color: var(--ink-2); white-space: nowrap; }
  .pill.live { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .pill.live::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 8px; box-shadow: 0 0 8px var(--accent); vertical-align: 1px; }
  .spacer { flex: 1; }

  /* ---------- hero ---------- */
  .hero { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; }
  .week { padding: 26px 28px 24px; display: grid; gap: 22px; }
  .headline { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
  .headline h1 { margin: 0; font-weight: 200; font-size: clamp(40px, 6.2vw, 78px); line-height: .95; letter-spacing: -.035em; text-wrap: balance; }
  .headline h1 b { font-weight: 500; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ring { position: relative; width: 132px; height: 132px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .c strong { font-size: 30px; font-weight: 300; letter-spacing: -.02em; }
  .ring .c span { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; }

  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .day { position: relative; border-radius: 16px; padding: 12px 10px 12px; min-height: 124px; display: flex; flex-direction: column; gap: 6px; border: 1px solid color-mix(in srgb, var(--fg) 8%, transparent); background: color-mix(in srgb, var(--sink) 18%, transparent); }
  .day .dn { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: var(--ink-3); text-transform: uppercase; }
  .day .dd { font-size: 22px; font-weight: 300; line-height: 1; }
  .day .what { font-size: 13px; color: var(--ink-2); line-height: 1.25; margin-top: auto; }
  .day .st { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
  .day.done { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 22%, transparent), color-mix(in srgb, var(--accent) 4%, transparent)); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .day.done .st { color: var(--accent); }
  .day.today { border-color: color-mix(in srgb, var(--warm) 60%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--warm) 35%, transparent), 0 0 30px -6px color-mix(in srgb, var(--warm) 55%, transparent); }
  .day.today .st { color: var(--warm); }
  .day.rest .what { color: var(--ink-3); }
  .day.plan .st { color: var(--ink-3); }
  .day .glyph { width: 18px; height: 18px; }
  button.day { font: inherit; color: inherit; text-align: left; cursor: pointer; transition: transform .18s ease, border-color .18s ease, background-color .18s ease; }
  button.day:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--fg) 28%, transparent); }
  button.day:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.day[aria-pressed="true"] { border-color: color-mix(in srgb, var(--fg) 55%, transparent); background-color: color-mix(in srgb, var(--fg) 7%, transparent); transform: translateY(-3px); }
  button.day[aria-pressed="true"]::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 10px; height: 10px; transform: translateX(-50%) rotate(45deg); background: color-mix(in srgb, var(--fg) 55%, transparent); border-radius: 2px; }

  .sess { border-radius: 18px; padding: 18px 20px; background: color-mix(in srgb, var(--sink) 26%, transparent); border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent); display: grid; gap: 14px; animation: rise .28s ease; }
  @keyframes rise { from { opacity: .3; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .sess { animation: none; } button.day { transition: none; } }
  .sess-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .sess-top h2 { margin: 0; font-size: 24px; font-weight: 300; letter-spacing: -.02em; }
  .sess-stats { display: flex; gap: 26px; flex-wrap: wrap; }
  .sess-stats .v { font-size: 26px; font-weight: 200; letter-spacing: -.02em; line-height: 1.1; }
  .sess-rows { display: grid; }
  .sess-row { display: grid; grid-template-columns: minmax(150px, 1fr) 2fr; gap: 14px; padding: 9px 0; border-top: 1px solid color-mix(in srgb, var(--fg) 7%, transparent); font-size: 14px; }
  .sess-row b { font-weight: 500; }
  .sess-row span { color: var(--ink-2); }
  .sess-note { font-size: 13px; color: var(--ink-2); }
  .sess-note::before { content: "→ "; color: var(--accent); }

  .side { display: grid; gap: 16px; grid-template-rows: auto 1fr; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px 16px; }
  .stat .v { font-size: 38px; font-weight: 200; letter-spacing: -.03em; line-height: 1; margin-top: 6px; }
  .stat .v small { font-size: 15px; font-weight: 400; color: var(--ink-3); margin-left: 4px; letter-spacing: 0; }
  .stat .d { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
  .up { color: var(--accent); } .down { color: var(--warm); }

  .achilles { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
  .tendon { width: 84px; height: 132px; }
  .ach-big { font-size: 34px; font-weight: 200; letter-spacing: -.02em; line-height: 1.05; }
  .rules { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

  /* ---------- middle ---------- */
  .mid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; }
  .grey-head { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin: 12px 0 18px; }
  .grey-head .big { font-size: clamp(64px, 9vw, 112px); font-weight: 200; letter-spacing: -.05em; line-height: .85; background: linear-gradient(180deg, var(--grey-top), var(--grey)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .grey-head p { margin: 0; max-width: 34ch; color: var(--ink-2); font-size: 14px; }
  .years { display: grid; gap: 10px; }
  .yr { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; }
  .yr .y { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
  .track { position: relative; display: flex; gap: 2px; height: 22px; border-radius: 6px; overflow: visible; }
  .seg { height: 100%; border-radius: 4px; min-width: 2px; cursor: default; }
  .target { position: absolute; top: -6px; bottom: -6px; width: 0; border-left: 1px dashed color-mix(in srgb, var(--accent) 80%, transparent); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; font-size: 12px; color: var(--ink-2); }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; background: var(--c); vertical-align: -1px; }

  .cap-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 14px; }
  .lock { border-radius: 14px; padding: 10px 12px; border: 1px dashed color-mix(in srgb, var(--fg) 14%, transparent); background: color-mix(in srgb, var(--sink) 14%, transparent); }
  .lock .t { font-size: 13px; color: var(--ink-2); }
  .lock .v { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-top: 2px; }
  .bests { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid color-mix(in srgb, var(--fg) 8%, transparent); }
  .best .v { font-size: 22px; font-weight: 300; letter-spacing: -.02em; }
  .best .t { font-size: 11.5px; color: var(--ink-3); }
  .countdown { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; }
  .countdown strong { font-size: 44px; font-weight: 200; letter-spacing: -.03em; }

  /* ---------- 52 weeks ---------- */
  .season-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .season-head .meta { display: flex; gap: 22px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
  .season-head .meta b { font-weight: 500; color: var(--ink); }
  .chart { position: relative; margin-top: 12px; overflow-x: auto; }
  .chart svg { display: block; width: 100%; min-width: 640px; height: auto; }
  .tip { position: fixed; z-index: 100; pointer-events: none; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--ground) 82%, transparent); border: 1px solid var(--edge); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font-size: 12px; min-width: 150px; transform: translate(-50%, -100%); white-space: nowrap; }
  .tip .h { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; margin-bottom: 6px; }
  .tip .r { display: flex; justify-content: space-between; gap: 14px; }
  .tip .r i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

  /* ---------- watch ---------- */
  .watch { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-top: 14px; }
  .chip { border-radius: 16px; padding: 12px 14px; background: color-mix(in srgb, var(--sink) 20%, transparent); border: 1px solid color-mix(in srgb, var(--fg) 8%, transparent); display: grid; gap: 4px; align-content: start; }
  .chip .k { font-size: 12px; color: var(--ink-3); }
  .chip .v { font-size: 24px; font-weight: 300; letter-spacing: -.02em; }
  .chip .s { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
  .chip .s::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .ok { color: var(--accent); } .wait { color: var(--ink-3); } .flag { color: var(--warn); } .hot { color: var(--hard); }

  footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: .04em; padding: 4px 6px; }

  @media (max-width: 1020px) {
    .hero, .mid { grid-template-columns: 1fr; }
    .watch { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 640px) {
    .wrap { padding-inline: 16px; }
    .days { grid-template-columns: repeat(4, 1fr); }
    .day { min-height: 104px; }
    .sess-row { grid-template-columns: 1fr; gap: 2px; }
    .watch { grid-template-columns: repeat(2, 1fr); }
    .bests { grid-template-columns: repeat(2, 1fr); }
    .cap-grid { grid-template-columns: 1fr 1fr; }
    header.bar { border-radius: 22px; }
    .ring { width: 108px; height: 108px; }
    .chart svg { width: 760px; max-width: none; }
  }

  /* ---------- navigation ---------- */
  .nav { display: flex; gap: 6px; flex-wrap: wrap; }
  a.pill { text-decoration: none; transition: border-color .15s ease, color .15s ease; }
  a.pill:hover { border-color: color-mix(in srgb, var(--fg) 35%, transparent); color: var(--ink); }
  a.pill:focus-visible, a.strip:focus-visible, a.wk:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a.pill[aria-current="page"] { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  a.strip { display: grid; grid-template-columns: auto 1fr; gap: 6px 22px; align-items: baseline; padding: 14px 22px; border-radius: 18px; text-decoration: none; color: inherit; }
  .strip .bn { font-size: 22px; font-weight: 300; letter-spacing: -.02em; white-space: nowrap; }
  .strip .bn b { font-weight: 500; }
  .strip .why { color: var(--ink-2); font-size: 14px; text-wrap: pretty; }
  .strip .meta { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
  .weeks { display: flex; gap: 6px; flex-wrap: wrap; }
  .wk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  a.wk { display: grid; gap: 10px; padding: 16px 18px; border-radius: 18px; text-decoration: none; color: inherit; background: color-mix(in srgb, var(--sink) 20%, transparent); border: 1px solid color-mix(in srgb, var(--fg) 10%, transparent); transition: transform .18s ease, border-color .18s ease; }
  a.wk:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--fg) 30%, transparent); }
  a.wk.now { border-color: color-mix(in srgb, var(--warm) 55%, transparent); box-shadow: 0 0 30px -10px color-mix(in srgb, var(--warm) 60%, transparent); }
  .wk .n { white-space: nowrap; font-size: 26px; font-weight: 200; letter-spacing: -.02em; line-height: 1; }
  .wk .dots { display: flex; gap: 5px; }
  .wk .dots i { width: 9px; height: 9px; border-radius: 50%; background: color-mix(in srgb, var(--fg) 12%, transparent); }
  .wk .dots i.done { background: var(--accent); box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 60%, transparent); }
  .wk .dots i.missed { background: transparent; border: 1px solid var(--hard); }
  .wk .dots i.rest { background: transparent; border: 1px dashed color-mix(in srgb, var(--fg) 18%, transparent); }
  .totals { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
  .review-text { color: var(--ink-2); font-size: 14px; white-space: pre-line; max-width: 75ch; }
  .day.missed { border-color: color-mix(in srgb, var(--hard) 40%, transparent); border-style: dashed; }
  .day.missed .st { color: var(--hard); }
  .spark { display: flex; gap: 4px; align-items: flex-end; height: 26px; margin-top: 10px; }
  .spark i { width: 7px; border-radius: 2px; background: var(--accent); opacity: .85; }
  .empty { color: var(--ink-3); font-size: 14px; }
  .sess-row.one { grid-template-columns: 1fr; }

<script>
// Everything on this page is read from the repo at load time. Nothing here is hand-typed data.
const ROOT = "../";
const FILES = {
  index: "wiki/index.md", log: "wiki/log.md", tests: "wiki/tests.md", history: "wiki/strava-history.md",
};
// The Strava exports are named in strava-history.md's "Row data" line, so a renamed export still loads.
const csvName = (history, kind) => (new RegExp(`strava-${kind}-[\\w-]+\\.csv`).exec(history || "") || [])[0];

// ---------- dates: ISO strings, UTC arithmetic ----------
const DAY = 864e5;
const ms = d => Date.parse(d + "T00:00:00Z");
const iso = t => new Date(t).toISOString().slice(0, 10);
const addDays = (d, n) => iso(ms(d) + n * DAY);
const diffDays = (a, b) => Math.round((ms(b) - ms(a)) / DAY);
const mondayOf = d => addDays(d, -((new Date(ms(d)).getUTCDay() + 6) % 7));
const fmt = (d, o) => new Date(ms(d)).toLocaleDateString("en-GB", { timeZone: "UTC", ...o });
const dm = d => fmt(d, { day: "numeric", month: "short" });
const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const TODAY = (() => {
  const q = new URLSearchParams(location.search).get("today");
  if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) return q;
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`;
})();

// ---------- text helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const plain = s => String(s ?? "").replace(/`\[[^\]]*\]`/g, "").replace(/\*\*|`/g, "").replace(/\s+/g, " ").trim();
const WORDS = ["No", "One", "Two", "Three", "Four", "Five", "Six", "Seven"];
const paceStr = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
const paceSec = p => { const m = /^(\d+):(\d{2})$/.exec(String(p || "")); return m ? +m[1] * 60 + +m[2] : null; };
function section(text, name) {
  const m = new RegExp(`^## ${name}[^\\n]*\\n([\\s\\S]*?)(?=^## |(?![\\s\\S]))`, "m").exec(text);
  return m ? m[1] : "";
}

// ---------- parsers ----------
function parseLog(text) {
  return text.split(/^## \[/m).slice(1).map(chunk => {
    const h = /^(\d{4}-\d{2}-\d{2})\] (\w+) \| (.*)/.exec(chunk);
    if (!h) return null;
    const e = { date: h[1], type: h[2], title: h[3].trim(), y: {}, lines: {} };
    const y = /```yaml\n([\s\S]*?)```/.exec(chunk);
    if (y) y[1].split("\n").forEach(l => {
      const m = /^(\w+):\s*([^#]*)/.exec(l);
      if (!m) return;
      const v = m[2].trim();
      e.y[m[1]] = /^-?\d+(\.\d+)?$/.test(v) ? +v : v;
    });
    let key = null;
    chunk.split("\n").forEach(l => {
      const m = /^- (Planned|Done|Beyond plan|Capacity|Review):\s*(.*)/.exec(l);
      if (m) { key = m[1]; e.lines[key] = m[2]; }
      else if (key && /^\s{2,}\S/.test(l)) e.lines[key] += " " + l.trim();
      else key = null;
    });
    return e;
  }).filter(Boolean);
}

function parseBlock(file, text) {
  const d = /Dates:\s*(\d{4}-\d{2}-\d{2})\s*→\s*(\d{4}-\d{2}-\d{2})(?:\s*\((\d+) weeks?\))?(?:.*?Phase:\s*([^·\n]+))?(?:.*?Status:\s*(\w+))?/.exec(text);
  if (!d) return null;
  const b = {
    id: file.replace(/\.md$/, ""), file,
    name: (/^# Block:\s*(.+)$/m.exec(text) || [, file])[1].trim(),
    start: d[1], end: d[2], phase: (d[4] || "").trim(), status: (d[5] || "").trim(),
  };
  b.weeks = +d[3] || Math.ceil((diffDays(b.start, b.end) + 1) / 7);
  const emph = plain(section(text, "Emphasis"));
  b.why = (/^.+?[.!?](?=\s|$)/.exec(emph) || [emph])[0];
  b.ceiling = plain((/^Ceiling:\s*(.+)$/m.exec(text) || [, ""])[1]);
  // Running targets: | Week | Run | Distance | ...
  b.targets = [];
  section(text, "Running").split("\n").forEach(l => {
    const m = /^\|\s*(\d+)\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|/.exec(l);
    if (m) b.targets.push({ week: +m[1], run: m[2], km: /km/.test(m[3]) ? parseFloat(m[3]) : null });
  });
  // Gym sessions: **Session X** then a numbered list
  b.sessions = {};
  const gym = section(text, "Gym");
  for (const m of gym.matchAll(/\*\*Session ([A-Z])\*\*\n((?:\d+\..*(?:\n|$))+)/g)) {
    b.sessions[m[1]] = m[2].trim().split("\n").map(l => {
      const t = plain(l.replace(/^\d+\.\s*/, ""));
      const i = t.indexOf(" — ");
      return i > 0 ? [t.slice(0, i), t.slice(i + 3)] : [t, ""];
    });
  }
  // Weekly schedule: **Week N (dates).** Constraint… then | Day | Planned | Changed |
  // A filled Changed cell is the plan now; the Planned cell is kept as `was`.
  b.schedule = {};
  const sched = section(text, "Weekly schedule");
  const heads = [...sched.matchAll(/\*\*Week (\d+)[^*]*\*\*([^\n]*)/g)];
  heads.forEach((m, i) => {
    const body = sched.slice(m.index, i + 1 < heads.length ? heads[i + 1].index : undefined);
    const days = {}, was = {};
    body.split("\n").forEach(l => {
      const r = /^\|\s*(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\w*\.?\s*\d*\s*\|\s*([^|]*?)\s*\|(?:\s*([^|]*?)\s*\|)?\s*$/.exec(l);
      if (!r) return;
      if (r[3]) { days[r[1]] = plain(r[3]); was[r[1]] = plain(r[2]); }
      else days[r[1]] = plain(r[2]);
    });
    b.schedule[+m[1]] = { note: plain(m[2]), days, was };
  });
  b.review = b.status === "reviewed" ? section(text, "Review").trim() : "";
  return b;
}

function parseCSV(text) {
  const [head, ...rows] = text.trim().split("\n");
  const keys = head.split(",");
  return rows.map(r => { const v = r.split(","); return Object.fromEntries(keys.map((k, i) => [k, v[i] ?? ""])); });
}

function parseBests(text) {
  const rows = section(text, "Races and bests").split("\n")
    .map(l => l.split("|").map(c => c.trim())).filter(c => c.length > 4 && !/^(Event|-+)$/.test(c[1]))
    .map(c => ({ ev: c[1], date: c[2], res: c[3] }));
  const yr = d => "’" + ((/(\d{4})\s*$/.exec(d) || [, ""])[1]).slice(2);
  const out = [];
  const mar = rows.find(r => /marathon/i.test(r.ev) && /PB/.test(r.res));
  if (mar) out.push([plain(mar.res).replace(/\s*\(PB\)/, ""), `Marathon · ${mar.ev.replace(/\s*marathon/i, "")} ${yr(mar.date)}`]);
  const half = rows.find(r => /^half/i.test(r.ev));
  if (half) { const t = half.res.split("/").map(s => s.trim()).sort()[0]; out.push([t, `Half ${yr(half.date)}`]); }
  const k5 = rows.find(r => /^5k/i.test(r.ev));
  if (k5) out.push([plain(k5.res).replace(/\s*\(.*\)/, ""), `5k ${yr(k5.date)}`]);
  const by = rows.filter(r => /backyard/i.test(r.ev)).map(r => ({ km: parseFloat(plain(r.res)), date: r.date })).sort((a, b) => b.km - a.km)[0];
  if (by) out.push([String(by.km), `km backyard ${yr(by.date)}`]);
  return out;
}

function parseTests(text) {
  const rows = section(text, "Results").split("\n").filter(l => /^\|/.test(l) && !/^\|\s*-/.test(l))
    .map(l => l.split("|").slice(1, -1).map(c => c.trim()));
  if (!rows.length) return null;
  const [head, ...body] = rows;
  const cols = head.slice(1).map((h, i) => ({ h, filled: body.some(r => r[i + 1] && !/^[—-]?$/.test(r[i + 1])) }));
  return { head, body, cols };
}

// ---------- derived data ----------
const BANDS = [
  { k: "easy", name: "Easy", c: "var(--easy)" },
  { k: "steady", name: "Steady", c: "var(--steady)" },
  { k: "grey", name: "Grey", c: "var(--grey)" },
  { k: "hard", name: "Hard", c: "var(--hard)" },
  { k: "race", name: "Race", c: "var(--race)" },
];
const bandOf = sPerKm => sPerKm < 285 ? "hard" : sPerKm < 315 ? "grey" : sPerKm < 330 ? "steady" : "easy";

function buildRuns(csv, log) {
  const runs = csv.map(r => ({ date: r.date, km: +r.dist_m / 1000, sec: +r.mov_s, note: r.note || "" })).filter(r => r.km > 0);
  const last = runs.reduce((m, r) => r.date > m ? r.date : m, "");
  log.filter(e => e.type === "run" && e.date > last && +e.y.distance_km > 0).forEach(e => {
    const km = +e.y.distance_km, p = paceSec(e.y.avg_pace);
    runs.push({ date: e.date, km, sec: p ? p * km : (+e.y.duration_min || 0) * 60, note: e.y.run_type === "race" ? "RACE" : "" });
  });
  runs.sort((a, b) => a.date < b.date ? -1 : 1);
  return { runs: runs.filter(r => !/EXCLUDE/.test(r.note)), csvTo: last };
}
function buildGym(csv, log) {
  const dates = csv.map(r => r.date);
  const last = dates.reduce((m, d) => d > m ? d : m, "");
  log.filter(e => e.type === "gym" && e.date > last).forEach(e => dates.push(e.date));
  return dates.sort();
}
const isRace = r => /^(BACKYARD|RACE)/.test(r.note);

// ---------- app ----------
const $ = id => document.getElementById(id);
const S = {};

async function get(path) {
  const r = await fetch(ROOT + path, { cache: "no-cache" });
  if (!r.ok) throw new Error(`${path} (${r.status})`);
  return r.text();
}

async function load() {
  const keys = Object.keys(FILES);
  const got = await Promise.allSettled(keys.map(k => get(FILES[k])));
  const T = Object.fromEntries(keys.map((k, i) => [k, got[i].status === "fulfilled" ? got[i].value : null]));
  if (!T.index || !T.log) throw new Error("wiki/index.md and wiki/log.md are required");
  const [runsCSV, gymCSV] = await Promise.all(["runs", "gym"].map(k => {
    const f = csvName(T.history, k);
    return f ? get("raw/history/" + f).catch(() => null) : null;
  }));
  T.runs = runsCSV; T.gym = gymCSV;
  S.log = parseLog(T.log);
  const files = [...new Set([...T.index.matchAll(/\((?:wiki\/)?blocks\/(\d{4}-\d{2}-[\w-]+\.md)\)/g)].map(m => m[1]))];
  const texts = await Promise.allSettled(files.map(f => get("wiki/blocks/" + f)));
  S.blocks = files.map((f, i) => texts[i].status === "fulfilled" ? parseBlock(f, texts[i].value) : null)
    .filter(Boolean).sort((a, b) => a.start < b.start ? -1 : 1);
  S.active = S.blocks.find(b => b.status === "active") || S.blocks.find(b => b.start <= TODAY && TODAY <= b.end) || S.blocks[S.blocks.length - 1];
  const R = buildRuns(T.runs ? parseCSV(T.runs) : [], S.log);
  S.runs = R.runs; S.csvTo = R.csvTo;
  S.gym = buildGym(T.gym ? parseCSV(T.gym) : [], S.log);
  S.tests = T.tests ? parseTests(T.tests) : null;
  S.bests = T.history ? parseBests(T.history) : [];
}

// Blocks & weeks
const weekStart = (b, n) => addDays(b.start, (n - 1) * 7);
const weekOf = (b, d) => d < b.start || d > b.end ? null : Math.floor(diffDays(b.start, d) / 7) + 1;
const entriesOn = d => S.log.filter(e => e.date === d && ["run", "gym", "rest"].includes(e.type));
function weeksWithData(b) {
  const out = [];
  for (let n = 1; n <= b.weeks; n++) {
    const s = weekStart(b, n), e = addDays(s, 6);
    if (b.schedule[n] || S.log.some(x => ["run", "gym", "rest"].includes(x.type) && x.date >= s && x.date <= e)) out.push(n);
  }
  return out;
}
function kindOf(text) {
  if (!text) return null;
  if (/^rest/i.test(text)) return "rest";
  if (/gym|session [a-z]\b/i.test(text)) return "gym";
  if (/easy|long|run|threshold|test|5k|stride|tempo/i.test(text)) return "run";
  return null;
}
const planShort = t => t.replace(/\s*[—-]\s*done\b.*$/i, "").replace(/✅/g, "").trim();
function buildWeek(b, n) {
  const s = weekStart(b, n), sch = b.schedule[n];
  return DOW.map((dow, i) => {
    const date = addDays(s, i);
    const plan = sch?.days[dow] ? planShort(sch.days[dow]) : null;
    const was = sch?.was[dow] ? planShort(sch.was[dow]) : null;
    const entries = entriesOn(date);
    const work = entries.filter(e => e.type !== "rest");
    const planKind = kindOf(plan);
    const kind = work.some(e => e.type === "gym") ? "gym" : work.length ? "run" : planKind || "rest";
    let st;
    if (work.length) st = "done";
    else if (date === TODAY) st = "today";
    else if (!sch) st = "none";
    else if (!planKind || planKind === "rest") st = "rest";
    else if (date < TODAY) st = "missed";
    else st = "plan";
    const what = work.length
      ? work.map(e => e.type === "run" ? `${e.y.distance_km} km @ ${e.y.avg_pace}` : `${e.title.split(" — ")[0]}${e.y.gym ? " · " + e.y.gym : ""}`).join(" + ")
      : plan ? plan.replace(/\s*@.*$/, "") : "—";
    return { date, dow, plan, was, planKind, entries, work, kind, st, what, isToday: date === TODAY };
  });
}
const plannedKm = (b, n, days) => {
  const t = b.targets.filter(x => x.week === n && x.km);
  if (t.length) return t.reduce((a, x) => a + x.km, 0);
  return days.reduce((a, d) => a + (d.plan && d.planKind === "run" ? parseFloat((/([\d.]+)\s*km/.exec(d.plan) || [, 0])[1]) : 0), 0);
};
const doneKm = days => days.reduce((a, d) => a + d.work.filter(e => e.type === "run").reduce((x, e) => x + (+e.y.distance_km || 0), 0), 0);

function blockStats(b, upTo = TODAY) {
  const weeks = weeksWithData(b);
  let due = 0, done = 0, missed = 0;
  weeks.forEach(n => buildWeek(b, n).forEach(d => {
    if (d.date > upTo) return;
    if (d.work.length) { done++; if (d.planKind && d.planKind !== "rest") due++; }
    else if (d.st === "missed") { due++; missed++; }
  }));
  const ents = S.log.filter(e => ["run", "gym", "rest"].includes(e.type) && e.date >= b.start && e.date <= b.end && e.date <= upTo);
  const runs = ents.filter(e => e.type === "run");
  const enjoy = ents.map(e => e.y.enjoyment).filter(v => typeof v === "number");
  return {
    weeks, done, due, missed,
    km: runs.reduce((a, e) => a + (+e.y.distance_km || 0), 0), runs: runs.length,
    gym: ents.filter(e => e.type === "gym").length,
    beyond: ents.filter(e => e.y.beyond_plan && e.y.beyond_plan !== "none").length,
    enjoy: enjoy.length ? enjoy.reduce((a, v) => a + v, 0) / enjoy.length : null,
    logged: ents.length,
  };
}

function achilles() {
  const pts = S.log.filter(e => typeof e.y.achilles_next_am === "number").map(e => ({ date: addDays(e.date, 1), v: e.y.achilles_next_am }))
    .sort((a, b) => a.date < b.date ? -1 : 1);
  const last = pts[pts.length - 1];
  const n = pts.length;
  const rising = n >= 3 && pts[n - 1].v > pts[n - 2].v && pts[n - 2].v > pts[n - 3].v;
  // Only the Achilles rule (>5/10, or two rising mornings) earns a word; otherwise just the score.
  const hold = !!last && (last.v > 5 || rising);
  const word = !last ? "No scores yet." : hold ? "Hold." : `${last.v} / 10`;
  const cls = hold ? "hot" : last ? "ok" : "wait";
  return { pts, last, rising, word, cls };
}

function lastSpike() {
  let spike = null;
  S.runs.forEach((r, i) => {
    const from = addDays(r.date, -28);
    let prev = 0;
    for (let j = i - 1; j >= 0 && S.runs[j].date >= from; j--) if (S.runs[j].date < r.date) prev = Math.max(prev, S.runs[j].km);
    if (prev > 0 && r.km > 1.7 * prev) spike = { ...r, ratio: r.km / prev };
  });
  return spike;
}

// ---------- tooltip ----------
const tip = $("tip");
function showTip(html, x, y) {
  tip.innerHTML = html; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight, m = 8;
  const left = Math.min(Math.max(x, w / 2 + m), window.innerWidth - w / 2 - m);
  const top = y - 12 - h < m ? y + h + 20 : y - 12;
  tip.style.left = left + "px"; tip.style.top = top + "px";
}
function hideTip() { tip.hidden = true; }

// ---------- components ----------
const icons = {
  run: '<svg class="glyph" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 12c3 0 4-6 7-6s4 6 7 6"/></svg>',
  gym: '<svg class="glyph" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 6v6M15 6v6M5.5 4.5v9M12.5 4.5v9M5.5 9h7"/></svg>',
  rest: '<svg class="glyph" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="9" cy="9" r="5"/></svg>',
};
const stLabel = { done: "Done", today: "Today", plan: "Planned", rest: "Rest", missed: "Not logged", none: "Unplanned" };

function ringSVG(done, planned) {
  const r = 52, C = 2 * Math.PI * r, f = planned ? Math.min(1, done / planned) : 0;
  return `<svg viewBox="0 0 120 120"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent-2)"/></linearGradient></defs>
    <circle cx="60" cy="60" r="${r}" fill="none" style="stroke:color-mix(in srgb, var(--fg) 10%, transparent)" stroke-width="6"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="url(#rg)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C * f} ${C}"/></svg>
    <div class="c"><strong class="num">${+done.toFixed(1)}</strong><span>${planned ? `of ${+planned.toFixed(1)} km` : "km"}</span></div>`;
}

function weekPanel(b, n, label) {
  const days = buildWeek(b, n);
  const runs = days.filter(d => d.kind === "run").length, lifts = days.filter(d => d.kind === "gym").length;
  const s = weekStart(b, n);
  const note = [b.schedule[n]?.note, b.ceiling && `Ceiling: ${b.ceiling}`].filter(Boolean).join(" ");
  return {
    days,
    html: `<div class="glass week">
      <div class="headline">
        <div>
          <div class="label">${esc(label)} · ${dm(s)} – ${dm(addDays(s, 6))}</div>
          <h1>${b.schedule[n] || runs + lifts ? `${WORDS[runs] || runs} run${runs === 1 ? "" : "s"},<br><b>${(WORDS[lifts] || String(lifts)).toLowerCase()} lift${lifts === 1 ? "" : "s"}.</b>` : `Not planned<br><b>yet.</b>`}</h1>
        </div>
        <div class="ring">${ringSVG(doneKm(days), plannedKm(b, n, days))}</div>
      </div>
      <div class="days" role="group" aria-label="Pick a day to see its session">${days.map((d, i) => `
        <button type="button" class="day ${d.st}${d.isToday && d.st !== "today" ? " today" : ""}${d.kind === "rest" ? " rest" : ""}" data-i="${i}" aria-pressed="false">
          <div style="display:flex;justify-content:space-between;align-items:center"><span class="dn">${d.dow}</span><span style="color:${d.st === "done" ? "var(--accent)" : "var(--ink-3)"}">${icons[d.kind]}</span></div>
          <div class="dd num">${+d.date.slice(8)}</div>
          <div class="what">${esc(d.what)}</div>
          <div class="st">${stLabel[d.st]}${d.was ? " · changed" : ""}</div>
        </button>`).join("")}</div>
      <div class="sess" aria-live="polite"></div>
      ${note ? `<div class="soft" style="font-size:13px">${esc(note)}</div>` : ""}
    </div>`,
  };
}

function sessionHTML(b, d) {
  const title = d.work.length
    ? d.work.map(e => e.type === "run" ? `${e.y.run_type ? e.y.run_type[0].toUpperCase() + e.y.run_type.slice(1) + " run" : "Run"}` : `${e.title.split(" — ")[0]}${e.y.gym ? " · " + e.y.gym + " gym" : ""}`).join(" + ")
    : d.plan || "Rest";
  const tag = d.st === "done" ? "Done · logged" : d.st === "missed" ? "Planned · not in the log" : d.st === "today" ? (d.planKind && d.planKind !== "rest" ? "Today · planned" : "Today · rest") : d.st === "plan" ? "Planned" : d.st === "none" ? "Not in a weekly plan" : "Rest";
  let stats = [], rows = [], notes = [];
  d.work.forEach(e => {
    const y = e.y;
    if (e.type === "run") stats.push(["Distance", y.distance_km != null ? `${y.distance_km} km` : null], ["Pace", y.avg_pace ? `${y.avg_pace} /km` : null], ["Time", y.duration_min ? `${y.duration_min} min` : null]);
    else stats.push(["Watch", y.duration_min ? `${y.duration_min} min` : null], ["Reactive", y.reactive_level != null ? `L${y.reactive_level}` : null]);
    stats.push(["RPE", y.rpe], ["Enjoyment", y.enjoyment != null ? `${y.enjoyment} / 5` : null], ["Achilles next AM", typeof y.achilles_next_am === "number" ? `${y.achilles_next_am} / 10` : null]);
    const done = plain(e.lines.Done || "");
    if (e.type === "gym") done.split(/(?<=\.)\s+(?=[A-Z])/).forEach(t => t && rows.push([t.replace(/\.$/, "")]));
    else if (done) notes.push(done);
    if (y.beyond_plan && y.beyond_plan !== "none") rows.push(["Beyond plan", plain(e.lines["Beyond plan"] || y.beyond_plan)]);
    if (e.lines.Review) notes.push(plain(e.lines.Review));
  });
  if (!d.work.length && d.planKind === "gym") {
    const k = (/session ([a-z])\b/i.exec(d.plan) || [])[1];
    if (k && b.sessions[k.toUpperCase()]) rows = b.sessions[k.toUpperCase()];
  }
  if (d.was) notes.unshift(`Changed from the original plan: ${d.was}`);
  d.entries.filter(e => e.type === "rest").forEach(e => e.lines.Review && notes.push(plain(e.lines.Review)));
  if (d.isToday) { const a = achilles(); if (a.last && a.last.date === d.date) stats.unshift(["Achilles this AM", `${a.last.v} / 10`]); }
  stats = stats.filter(s => s[1] != null && s[1] !== "");
  return `<div class="sess-top"><h2>${d.dow} ${+d.date.slice(8)} · ${esc(title)}</h2><span class="label">${tag}</span></div>
    ${stats.length ? `<div class="sess-stats">${stats.map(([k, v]) => `<div><div class="label">${esc(k)}</div><div class="v num">${esc(v)}</div></div>`).join("")}</div>` : ""}
    ${rows.length ? `<div class="sess-rows">${rows.map(r => r.length > 1 && r[1] ? `<div class="sess-row"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>` : `<div class="sess-row one"><span>${esc(r[0])}</span></div>`).join("")}</div>` : ""}
    ${notes.map(n => `<div class="sess-note">${esc(n)}</div>`).join("")}`;
}

function wireWeek(root, b, days) {
  const grid = root.querySelector(".days"), panel = root.querySelector(".sess");
  const pick = i => {
    grid.querySelectorAll(".day").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.i === i)));
    panel.innerHTML = sessionHTML(b, days[i]);
    panel.style.animation = "none"; panel.offsetHeight; panel.style.animation = "";
  };
  grid.addEventListener("click", e => { const x = e.target.closest(".day"); if (x) pick(+x.dataset.i); });
  const t = days.findIndex(d => d.isToday);
  const next = days.findIndex(d => d.date > TODAY && d.planKind && d.planKind !== "rest");
  pick(t >= 0 ? t : next >= 0 ? next : days.reduce((a, d, i) => d.work.length ? i : a, 0));
}

function stripHTML(b) {
  const n = weekOf(b, TODAY);
  const pills = [
    n ? `Week ${n} of ${b.weeks}` : b.status === "reviewed" ? "Reviewed" : TODAY < b.start ? "Starts " + dm(b.start) : "Finished",
    `${dm(b.start)} → ${dm(b.end)}`, b.phase && `Phase ${b.phase}`,
  ].filter(Boolean);
  return `<a class="glass strip" href="#${b.id}">
    <div class="bn">${b === S.active ? "Now in " : ""}<b>${esc(b.name)}</b></div>
    <div class="why">${esc(b.why)}</div>
    <div class="meta">${pills.map(p => `<span class="pill">${esc(p)}</span>`).join("")}</div>
  </a>`;
}

// ---------- views ----------
function viewNow() {
  const b = S.active;
  if (!b) return `<section class="glass"><div class="empty">No block in wiki/index.md yet.</div></section>`;
  const n = Math.min(Math.max(weekOf(b, TODAY) || (TODAY < b.start ? 1 : b.weeks), 1), b.weeks);
  const wp = weekPanel(b, n, TODAY >= weekStart(b, n) && TODAY <= addDays(weekStart(b, n), 6) ? "This week" : `Week ${n}`);
  S.after = root => wireWeek(root.querySelector(".week"), b, wp.days);

  // rolling 4 weeks
  const from = addDays(TODAY, -27), from21 = addDays(TODAY, -20);
  const r28 = S.runs.filter(r => r.date >= from && r.date <= TODAY);
  const g28 = S.gym.filter(d => d >= from && d <= TODAY).length;
  const long21 = Math.max(0, ...S.runs.filter(r => r.date >= from21 && r.date <= TODAY).map(r => r.km));
  const days = wp.days;
  const pRuns = days.filter(d => d.planKind === "run").length, pGym = days.filter(d => d.planKind === "gym").length;
  const gDone = days.filter(d => d.work.some(e => e.type === "gym")).length;
  const longT = b.targets.find(t => t.week === n && /long/i.test(t.run) && t.km);
  const pk = plannedKm(b, n, days);

  const a = achilles();
  const glow = { ok: "var(--accent)", hot: "var(--hard)", wait: "var(--ink-3)" }[a.cls];
  const spark = a.pts.length >= 2 ? `<div class="spark" aria-label="Morning scores">${a.pts.slice(-14).map(p => `<i title="${dm(p.date)}: ${p.v}/10" style="height:${4 + p.v * 2.2}px;background:${p.v > 5 ? "var(--hard)" : "var(--accent)"}"></i>`).join("")}</div>` : "";

  // pace shares by year: backyards and hikes excluded, as in strava-history.md
  const years = {};
  S.runs.filter(r => !/^BACKYARD/.test(r.note)).forEach(r => {
    const y = r.date.slice(0, 4), band = bandOf(r.sec / r.km);
    years[y] ??= { easy: 0, steady: 0, grey: 0, hard: 0 };
    years[y][band] += r.sec;
  });
  const ys = Object.keys(years).sort().slice(-4).map(y => {
    const t = years[y], T = t.easy + t.steady + t.grey + t.hard;
    return { y, easy: t.easy / T * 100, steady: t.steady / T * 100, grey: t.grey / T * 100, hard: t.hard / T * 100 };
  });
  const cur = ys[ys.length - 1];
  const neverMet = ys.every(y => y.easy < 80);

  // tests
  const T = S.tests;
  const filled = T ? T.cols.map((c, i) => c.filled ? i : -1).filter(i => i >= 0) : [];
  const lastCol = filled[filled.length - 1], prevCol = filled[filled.length - 2];
  const testRows = T ? T.body.filter(r => !/^(Date|Bodyweight|Over-ceiling)/i.test(r[0])).slice(0, 6) : [];
  const gate = name => /seated calf/i.test(name) ? "gate: ≥1.0× BW for Reactive 4" : /heel raise/i.test(name) ? "gate: ≥80–90% symmetry" : null;
  const toEnd = diffDays(TODAY, b.end);

  const bl = blockStats(b);
  const spike = lastSpike();
  const lastLog = S.log.filter(e => ["run", "gym", "rest", "test"].includes(e.type)).map(e => e.date).sort().pop();
  const stale = lastLog ? diffDays(lastLog, TODAY) : null;
  const yr = cur ? cur.y : TODAY.slice(0, 4);
  const yRuns = S.runs.filter(r => r.date.startsWith(yr));
  const wksYr = Math.max(1, (diffDays(`${yr}-01-01`, TODAY < `${yr}-12-31` ? TODAY : `${yr}-12-31`) + 1) / 7);

  return `
  <section class="hero">
    ${wp.html}
    <div class="side">
      <div class="glass">
        <p class="q">Am I progressing?</p>
        <div class="label">Rolling 4 weeks vs this week's plan</div>
        <div class="stats" style="margin-top:16px">
          <div class="stat"><div class="label">Volume</div><div class="v num">${(r28.reduce((x, r) => x + r.km, 0) / 4).toFixed(1)}<small>km/wk</small></div><div class="d">${pk ? `Plan this week ${+pk.toFixed(1)} km` : "No distance planned"}</div></div>
          <div class="stat"><div class="label">Runs</div><div class="v num">${(r28.length / 4).toFixed(1)}<small>/wk</small></div><div class="d">Planned this week ${pRuns}</div></div>
          <div class="stat"><div class="label">Gym</div><div class="v num">${(g28 / 4).toFixed(1)}<small>/wk</small></div><div class="d">Planned ${pGym} · <span class="up">${gDone} done this week</span></div></div>
          <div class="stat"><div class="label">Long run</div><div class="v num">${long21.toFixed(1)}<small>km</small></div><div class="d">Longest, last 3 wks${longT ? ` · target ${longT.km}` : ""}</div></div>
        </div>
      </div>
      <div class="glass achilles">
        <svg class="tendon" viewBox="0 0 84 132" aria-hidden="true">
          <defs>
            <radialGradient id="hot" cx="50%" cy="50%" r="50%"><stop offset="0" style="stop-color:${glow}" stop-opacity=".9"/><stop offset="1" style="stop-color:${glow}" stop-opacity="0"/></radialGradient>
            <linearGradient id="leg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--fg)" stop-opacity=".02"/><stop offset="1" style="stop-color:var(--fg)" stop-opacity=".22"/></linearGradient>
          </defs>
          <path d="M30 0 C28 40 34 70 40 96 C42 106 38 112 26 116 C14 120 8 124 10 128 L74 128 C78 124 74 118 66 114 C58 110 56 100 56 88 C58 60 60 30 58 0 Z" fill="url(#leg)" stroke="rgba(255,255,255,.18)"/>
          <circle cx="46" cy="100" r="18" fill="url(#hot)"/>
          <circle cx="46" cy="100" r="3.5" style="fill:${glow}"/>
        </svg>
        <div>
          <div class="label">Achilles · morning signal</div>
          <div class="ach-big">${a.word}</div>
          <div class="soft" style="font-size:13px;margin-top:4px">${a.last ? `Morning of ${fmt(a.last.date, { weekday: "short", day: "numeric", month: "short" })}: ${a.last.v}/10.${a.rising ? " Two rising mornings: hold volume, drop the next quality session." : ""} ${a.pts.length} score${a.pts.length === 1 ? "" : "s"} logged.` : "No next-morning scores in the log yet."}</div>
          ${spark}
          <div class="rules"><span class="pill">Load ≤5/10</span><span class="pill">Settled by AM</span><span class="pill">2 rising AMs → hold</span></div>
        </div>
      </div>
    </div>
  </section>

  <section class="mid">
    <div class="glass">
      <p class="q">Am I running the right way?</p>
      <div class="label">Share of running time by pace · backyards and hikes excluded</div>
      ${cur ? `<div class="grey-head">
        <div class="big num">${Math.round(cur.grey)}%</div>
        <p>of ${cur.y} running sits in the grey zone, 4:45–5:15/km. Easy is ${Math.round(cur.easy)}%. The dashed line is the ~80% easy target${neverMet ? ", not met in any year shown" : ""}.</p>
      </div>
      <div class="years">${ys.map(y => `<div class="yr"><div class="y">${y.y}</div><div class="track">${["easy", "steady", "grey", "hard"].map(k => {
        const bd = BANDS.find(x => x.k === k);
        return `<div class="seg" data-y="${y.y}" data-k="${bd.name}" data-v="${y[k]}" style="flex:${y[k]};background:${bd.c}"></div>`;
      }).join("")}<div class="target" style="left:80%"></div></div></div>`).join("")}</div>
      <div class="legend">
        <span style="--c:var(--easy)">Easy ≥5:30</span><span style="--c:var(--steady)">Steady 5:15–5:30</span>
        <span style="--c:var(--grey)">Grey 4:45–5:15</span><span style="--c:var(--hard)">Hard &lt;4:45</span>
      </div>` : `<div class="empty">No running data found.</div>`}
    </div>

    <div class="glass">
      <p class="q">How is capacity changing?</p>
      ${T ? (lastCol == null ? `
        <div class="label">Test battery · baseline pending</div>
        <div class="countdown"><strong class="num">${Math.max(0, toEnd)}</strong><span class="soft">days to the first baseline — end of ${esc(b.name)}</span></div>
        <div class="cap-grid">${testRows.map(r => `<div class="lock"><div class="t">${esc(r[0])}</div><div class="v">${esc(gate(r[0]) || `— · wk ${b.weeks}`)}</div></div>`).join("")}</div>` : `
        <div class="label">Test battery · ${esc(T.cols[lastCol].h)}</div>
        <div class="countdown"><strong class="num">${Math.max(0, toEnd)}</strong><span class="soft">days to the next test — end of ${esc(b.name)}</span></div>
        <div class="cap-grid">${testRows.map(r => `<div class="lock" style="border-style:solid"><div class="t">${esc(r[0])}</div><div class="v" style="color:var(--ink)">${esc(r[lastCol + 1] || "—")}${prevCol != null && r[prevCol + 1] ? ` <span class="muted">· was ${esc(r[prevCol + 1])}</span>` : ""}</div></div>`).join("")}</div>`)
      : `<div class="empty">wiki/tests.md not found.</div>`}
      ${S.bests.length ? `<div class="bests">${S.bests.map(([v, t]) => `<div class="best"><div class="v num">${esc(v)}</div><div class="t">${esc(t)}</div></div>`).join("")}</div>` : ""}
    </div>
  </section>

  <section class="glass">
    <div class="season-head">
      <div><p class="q">Fifty-two weeks</p><div class="label">Weekly km by pace band · dots are gym sessions</div></div>
      <div class="meta">
        <span>${yr} avg <b class="num">${(yRuns.reduce((x, r) => x + r.km, 0) / wksYr).toFixed(1)} km/wk</b></span>
        <span>Longest ’${yr.slice(2)} <b class="num">${Math.max(0, ...yRuns.map(r => r.km)).toFixed(1)} km</b></span>
        <span>Gym ’${yr.slice(2)} <b class="num">${(S.gym.filter(d => d.startsWith(yr)).length / wksYr).toFixed(2)}/wk</b></span>
      </div>
    </div>
    <div class="chart" id="chart"></div>
  </section>

  <section class="glass">
    <p class="q">Is anything becoming a problem?</p>
    <div class="label">Read from the log · ${esc(b.name)} so far</div>
    <div class="watch">
      <div class="chip"><div class="k">Adherence</div><div class="v num">${bl.due ? `${bl.due - bl.missed} / ${bl.due}` : "—"}</div><div class="s wait">${bl.missed ? `${bl.missed} not logged` : bl.due ? "All logged" : "Nothing due yet"}</div></div>
      <div class="chip"><div class="k">Beyond plan</div><div class="v num">${bl.beyond}</div><div class="s wait">Sessions over plan</div></div>
      <div class="chip"><div class="k">Achilles next AM</div><div class="v num">${a.last ? `${a.last.v} / 10` : "—"}</div><div class="s ${a.cls}">${a.last ? (a.rising ? "Rising" : dm(a.last.date)) : "None logged"}</div></div>
      <div class="chip"><div class="k">Enjoyment</div><div class="v num">${bl.enjoy != null ? `${bl.enjoy.toFixed(1)} / 5` : "—"}</div><div class="s wait">${bl.enjoy == null ? "Not reported" : "Average so far"}</div></div>
      <div class="chip"><div class="k">Last spike (>1.7× 28-day max)</div><div class="v num">${spike ? `×${spike.ratio.toFixed(1)}` : "—"}</div><div class="s wait">${spike ? `${esc(spike.note ? spike.note.replace(/^RACE_|^BACKYARD_?/, "").replace(/_/g, " ").trim() || "Race" : "Run")} · ${dm(spike.date)}` : "None found"}</div></div>
      <div class="chip"><div class="k">Last logged</div><div class="v num">${lastLog ? dm(lastLog) : "—"}</div><div class="s wait">${stale == null ? "Nothing logged" : stale === 0 ? "Today" : `${stale} day${stale === 1 ? "" : "s"} ago`}</div></div>
    </div>
  </section>`;
}

function viewBlock(b) {
  const bl = blockStats(b);
  const cur = weekOf(b, TODAY);
  return `
  <section class="glass">
    <p class="q">${esc(b.name)} so far</p>
    <div class="label">Read from the log · ${dm(b.start)} → ${dm(TODAY < b.end ? TODAY : b.end)}</div>
    <div class="totals" style="margin-top:16px">
      <div class="stat"><div class="label">Running</div><div class="v num">${bl.km.toFixed(1)}<small>km</small></div><div class="d">${bl.runs} run${bl.runs === 1 ? "" : "s"}</div></div>
      <div class="stat"><div class="label">Gym</div><div class="v num">${bl.gym}<small>sessions</small></div></div>
      <div class="stat"><div class="label">Adherence</div><div class="v num">${bl.due ? Math.round((bl.due - bl.missed) / bl.due * 100) : "—"}<small>${bl.due ? "%" : ""}</small></div><div class="d">${bl.missed} not logged</div></div>
      <div class="stat"><div class="label">Beyond plan</div><div class="v num">${bl.beyond}</div></div>
      <div class="stat"><div class="label">Enjoyment</div><div class="v num">${bl.enjoy != null ? bl.enjoy.toFixed(1) : "—"}<small>${bl.enjoy != null ? "/ 5" : ""}</small></div></div>
    </div>
  </section>
  ${bl.weeks.length ? `<section class="glass">
    <p class="q">Weeks</p>
    <div class="label">Only weeks with a plan or a log entry</div>
    <div class="wk-grid" style="margin-top:14px">${bl.weeks.map(n => {
      const days = buildWeek(b, n), s = weekStart(b, n);
      const km = doneKm(days), done = days.filter(d => d.work.length).length;
      return `<a class="wk${n === cur ? " now" : ""}" href="#${b.id}/w${n}">
        <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="n">Week ${n}</span><span class="label">${dm(s)} – ${dm(addDays(s, 6))}</span></div>
        <div class="dots">${days.map(d => `<i class="${d.st === "done" ? "done" : d.st === "missed" ? "missed" : d.kind === "rest" ? "rest" : ""}" title="${d.dow}: ${stLabel[d.st]}"></i>`).join("")}</div>
        <div class="soft" style="font-size:13px">${done} session${done === 1 ? "" : "s"} done · ${+km.toFixed(1)} km${n === cur ? " · this week" : ""}</div>
      </a>`;
    }).join("")}</div>
  </section>` : ""}
  ${b.review ? `<section class="glass"><p class="q">Block review</p><div class="review-text" style="margin-top:10px">${esc(plain(b.review.replace(/\n/g, " ⏎ ")).replace(/ ⏎ /g, "\n"))}</div></section>` : ""}`;
}

function viewWeek(b, n) {
  const wp = weekPanel(b, n, `Week ${n}`);
  S.after = root => wireWeek(root.querySelector(".week"), b, wp.days);
  return wp.html;
}

// ---------- charts ----------
function drawYears(root) {
  root.querySelectorAll(".seg").forEach(s => {
    s.addEventListener("mousemove", e => showTip(`<div class="h">${s.dataset.y}</div><div class="r"><span>${s.dataset.k}</span><b class="num">${(+s.dataset.v).toFixed(1)}%</b></div>`, e.clientX, e.clientY));
    s.addEventListener("mouseleave", hideTip);
  });
}
function drawChart(host) {
  if (!host) return;
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const end = mondayOf(TODAY);
  const weeks = Array.from({ length: 52 }, (_, i) => ({ w: addDays(end, (i - 51) * 7), easy: 0, steady: 0, grey: 0, hard: 0, race: 0, gym: 0, notes: [] }));
  const idx = d => { const i = diffDays(weeks[0].w, mondayOf(d)) / 7; return i >= 0 && i < 52 ? i : -1; };
  S.runs.forEach(r => { const i = idx(r.date); if (i < 0) return; const b = isRace(r) ? "race" : bandOf(r.sec / r.km); weeks[i][b] += r.km; if (isRace(r)) weeks[i].notes.push(r.note.replace(/^RACE_|^BACKYARD_?/, "").replace(/_/g, " ").trim() || "Race"); });
  S.gym.forEach(d => { const i = idx(d); if (i >= 0) weeks[i].gym++; });
  const W = 1200, H = 260, padL = 34, padR = 8, padT = 16, padB = 46, cap = 60;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Weekly running km over 52 weeks, stacked by pace band" }, host);
  const glow = el("filter", { id: "glow", x: "-50%", y: "-50%", width: "200%", height: "200%" }, el("defs", {}, svg));
  el("feGaussianBlur", { stdDeviation: 6 }, glow);
  const iw = W - padL - padR, ih = H - padT - padB, slot = iw / 52, bw = Math.max(6, slot - 6);
  const y = v => padT + ih - Math.min(v, cap) / cap * ih;
  const mono = { style: "fill:var(--ink-3)", "font-size": 11, "font-family": "IBM Plex Mono, monospace" };
  [0, 20, 40, 60].forEach(t => {
    el("line", { x1: padL, x2: W - padR, y1: y(t), y2: y(t), style: "stroke:color-mix(in srgb, var(--fg) 7%, transparent)" }, svg);
    el("text", { x: padL - 8, y: y(t) + 4, "text-anchor": "end", ...mono }, svg).textContent = t;
  });
  weeks.forEach((w, i) => {
    const x = padL + i * slot + (slot - bw) / 2, g = el("g", {}, svg), isNow = i === 51;
    if (isNow) el("rect", { x: x - 4, y: padT, width: bw + 8, height: ih, rx: 6, style: "fill:color-mix(in srgb, var(--accent) 8%, transparent)" }, g);
    let base = 0;
    const total = BANDS.reduce((s, b) => s + w[b.k], 0);
    BANDS.forEach(b => {
      const v = w[b.k]; if (!v) return;
      const top = y(base + v), bot = y(base);
      el("rect", { x, y: top, width: bw, height: Math.max(1.5, bot - top - 2), rx: 3, style: `fill:${b.c}`, opacity: isNow ? 1 : .9 }, g);
      base += v;
    });
    if (total > cap) el("text", { x: x + bw / 2, y: padT - 4, "text-anchor": "middle", ...mono, style: "fill:var(--ink)", "font-size": 10.5 }, g).textContent = Math.round(total) + "↑";
    for (let k = 0; k < w.gym; k++) el("circle", { cx: x + bw / 2, cy: H - padB + 12 + k * 8, r: 2.6, style: "fill:var(--accent)" }, g);
    if (+w.w.slice(8) <= 7) el("text", { x: x + bw / 2, y: H - 6, "text-anchor": "middle", ...mono }, g).textContent = fmt(w.w, { month: "short" });
    if (isNow) {
      el("circle", { cx: x + bw / 2, cy: y(total) - 10, r: 9, style: "fill:var(--accent)", opacity: .5, filter: "url(#glow)" }, g);
      el("circle", { cx: x + bw / 2, cy: y(total) - 10, r: 3.5, style: "fill:var(--accent)" }, g);
    }
    const hit = el("rect", { x: padL + i * slot, y: padT, width: slot, height: ih + 34, fill: "transparent" }, g);
    hit.addEventListener("mousemove", e => {
      const rows = BANDS.filter(b => w[b.k]).map(b => `<div class="r"><span><i style="background:${b.c}"></i>${b.name}</span><b class="num">${w[b.k].toFixed(1)} km</b></div>`).join("");
      const note = isNow ? "This week, so far" : w.notes.join(", ");
      showTip(`<div class="h">Week of ${fmt(w.w, { day: "numeric", month: "short", year: "2-digit" })}${note ? " · " + esc(note) : ""}</div>${rows || '<div class="r muted">No running</div>'}<div class="r" style="margin-top:6px;border-top:1px solid color-mix(in srgb, var(--fg) 10%, transparent);padding-top:6px"><span>Total</span><b class="num">${total.toFixed(1)} km</b></div><div class="r"><span>Gym</span><b class="num">${w.gym}</b></div>`, e.clientX, e.clientY);
    });
    hit.addEventListener("mouseleave", hideTip);
  });
}

// ---------- palette: one per week, from the recipe book ----------
// Each week (by its Monday) deterministically picks a recipe and a hue, so a week keeps its
// colours on every device and past weeks keep theirs. The name is "<hue word> <recipe>".
// To grow the book, add a recipe. To fix a week you don't like, pin it in PINNED.
const RECIPES = [
  { name: "dusk",     mode: "dark",  hue: [25, 60],   shift: 125 },   // ember glow, mint accent
  { name: "frost",    mode: "light", hue: [215, 255], shift: 25 },    // bright, frosted, blue
  { name: "nocturne", mode: "dark",  hue: [250, 295], shift: 175 },   // violet night, amber accent
  { name: "bloom",    mode: "light", hue: [335, 370], shift: 160 },   // pastel rose, deep teal accent
  { name: "canopy",   mode: "dark",  hue: [140, 175], shift: -115 },  // forest, coral accent
  { name: "haze",     mode: "light", hue: [55, 90],   shift: 170 },   // sand and sun, indigo accent
];
const PINNED = {
  "2026-09-21": { recipe: "dusk", hue: 42 },   // the original ember-and-mint week
};
const HUE_WORDS = [[20, "cherry"], [45, "ember"], [75, "amber"], [105, "citrus"], [150, "moss"], [185, "jade"],
  [215, "lagoon"], [250, "cobalt"], [285, "indigo"], [320, "violet"], [345, "orchid"], [360, "cherry"]];
const hueWord = h => HUE_WORDS.find(([m]) => ((h % 360) + 360) % 360 < m)[1];

function oklch(L, C, h) {
  const r = h * Math.PI / 180, a = C * Math.cos(r), b = C * Math.sin(r);
  const l = (L + .3963377774 * a + .2158037573 * b) ** 3, m = (L - .1055613458 * a - .0638541728 * b) ** 3, s = (L - .0894841775 * a - 1.291485548 * b) ** 3;
  const lin = [4.0767416621 * l - 3.3077115913 * m + .2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - .3413193965 * s, -.0041960863 * l - .7034186147 * m + 1.707614701 * s];
  return "#" + lin.map(x => { x = Math.min(1, Math.max(0, x)); x = x <= .0031308 ? 12.92 * x : 1.055 * x ** (1 / 2.4) - .055; return Math.round(x * 255).toString(16).padStart(2, "0"); }).join("");
}
function lum(hex) {
  const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4);
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
}
const rgba = (hex, a) => `rgba(${[1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)).join(",")},${a})`;
const contrast = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + .05) / (y + .05); };
// Walk lightness away from the ground until the colour reads at the required contrast.
function readable(L, C, h, ground, min, dark) {
  let c = oklch(L, C, h);
  for (let i = 0; i < 30 && contrast(c, ground) < min; i++) { L += dark ? .015 : -.015; c = oklch(L, C, h); }
  return c;
}
function rand(seed) {  // mulberry32
  let t = (seed + 0x6d2b79f5) | 0;
  t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const REROLL = +(new URLSearchParams(location.search).get("palette") || 0);
// Recipes are dealt like a shuffled deck: every recipe once per cycle, reshuffled each cycle,
// never the same recipe two weeks running (pins included).
function dealt(w) {
  const n = RECIPES.length, cycle = Math.floor(w / n), order = [...RECIPES.keys()];
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(rand(cycle * 9973 + i) * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  return order[((w % n) + n) % n];
}
function pickFor(monday) {
  if (!REROLL && PINNED[monday]) return { recipe: RECIPES.find(r => r.name === PINNED[monday].recipe) || RECIPES[0], hue: PINNED[monday].hue };
  const w = Math.round(ms(monday) / (7 * DAY)) + REROLL * 7919;
  const prevPin = !REROLL && PINNED[addDays(monday, -7)];
  const prev = prevPin ? RECIPES.findIndex(r => r.name === prevPin.recipe) : dealt(w - 1);
  let i = dealt(w);
  if (i === prev) i = (i + 1) % RECIPES.length;
  const recipe = RECIPES[i];
  return { recipe, hue: recipe.hue[0] + rand(w * 40503 + 7) * (recipe.hue[1] - recipe.hue[0]) };
}
function paletteFor(monday, mode) {
  const { recipe, hue } = pickFor(monday);
  const dark = (mode || recipe.mode) === "dark", h = hue, ah = hue + recipe.shift;
  const ground = dark ? oklch(.155, .012, h) : oklch(.89, .03, h);   // light: mid-tone, so the glass has colour to frost
  const P = {
    name: `${hueWord(h)} ${recipe.name}`, dark, ground,
    ink: dark ? oklch(.95, .01, h) : oklch(.22, .02, h),
    "ink-2": readable(dark ? .8 : .42, .015, h, ground, 7, dark),
    "ink-3": readable(dark ? .62 : .54, .015, h, ground, 4.5, dark),
    fg: dark ? "#ffffff" : oklch(.25, .02, h),
    sink: dark ? "#000000" : "#ffffff",
    glass: dark ? "rgba(255,255,255,.045)" : "rgba(255,255,255,.18)",
    "glass-hi": dark ? "rgba(255,255,255,.10)" : "rgba(255,255,255,.42)",
    edge: dark ? "rgba(255,255,255,.13)" : "rgba(255,255,255,.65)",
    highlight: dark ? "rgba(255,255,255,.08)" : "rgba(255,255,255,.9)",
    "shadow-color": dark ? "rgba(0,0,0,.6)" : rgba(oklch(.35, .1, h), .35),
    accent: readable(dark ? .88 : .5, dark ? .14 : .15, ah, ground, 4.5, dark),
    "accent-2": dark ? oklch(.96, .05, ah) : oklch(.38, .12, ah),
    warm: readable(dark ? .72 : .6, .17, h, ground, 3, dark),
    "glow-1a": dark ? oklch(.7, .17, h) : oklch(.78, .15, h), "glow-1b": dark ? oklch(.5, .16, h) : oklch(.68, .18, h),
    "glow-2a": dark ? oklch(.46, .09, ah) : oklch(.79, .12, ah), "glow-2b": dark ? oklch(.3, .06, ah) : oklch(.87, .08, ah),
    "glow-3": dark ? oklch(.5, .04, h + 60) : oklch(.78, .11, h + 60),
    "blob-opacity": dark ? ".75" : ".9",
    // Pace colours keep their meaning every week; only their lightness follows the mode.
    easy: dark ? "#4fd8a0" : "#1b9a6b", steady: dark ? "#2f8a70" : "#7cc4a8", grey: dark ? "#8d90a0" : "#9a9dab",
    "grey-top": dark ? "#e3e4ea" : "#5b5e6b", hard: dark ? "#ff7a45" : "#e0602c", race: dark ? "#f3ece4" : "#2b2f36",
  };
  return P;
}
// Light/dark: each week's recipe picks a default; the header button overrides it, and the
// choice is remembered in this browser until switched back.
let MODE = null;
try { MODE = localStorage.getItem("olavi-mode"); } catch (e) {}
const ICONS = {
  sun: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3 3l1 1M12 12l1 1M3 13l1-1M12 4l1-1"/></svg>',
  moon: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M13.5 9.5A6 6 0 0 1 6.5 2.5a6 6 0 1 0 7 7z"/></svg>',
};
function applyPalette(monday) {
  S.monday = monday;
  const P = paletteFor(monday, MODE), root = document.documentElement.style;
  Object.entries(P).forEach(([k, v]) => typeof v === "string" && k !== "name" && root.setProperty("--" + k, v));
  root.setProperty("color-scheme", P.dark ? "dark" : "light");
  document.documentElement.dataset.mode = P.dark ? "dark" : "light";
  $("mood-pill").innerHTML = `<i></i>${esc(P.name)}`;
  const btn = $("mode-btn");
  $("knob").innerHTML = P.dark ? ICONS.moon : ICONS.sun;
  btn.setAttribute("aria-checked", String(P.dark));
  btn.title = P.dark ? "Dark mode · switch to light" : "Light mode · switch to dark";
  // First paint lands without a fade; later changes (switch, week to week) blend.
  if (document.documentElement.classList.contains("instant")) requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove("instant")));
}
$("mode-btn").addEventListener("click", () => {
  MODE = document.documentElement.dataset.mode === "dark" ? "light" : "dark";
  try { localStorage.setItem("olavi-mode", MODE); } catch (err) {}
  if (S.monday) applyPalette(S.monday);
});

// ---------- router ----------
function render() {
  hideTip();
  S.after = null;
  const [bid, wk] = decodeURIComponent(location.hash.slice(1)).split("/");
  const b = S.blocks.find(x => x.id === bid);
  const n = b && wk && /^w\d+$/.test(wk) ? +wk.slice(1) : null;
  const route = !b ? "now" : n && weeksWithData(b).includes(n) ? "week" : "block";
  const cur = b || S.active;
  applyPalette(route === "week" ? weekStart(b, n) : route === "block" ? mondayOf(b.start) : mondayOf(TODAY));

  $("nav").innerHTML = [`<a class="pill" href="#now"${route === "now" ? ' aria-current="page"' : ""}>Now</a>`,
    ...S.blocks.map(x => `<a class="pill" href="#${x.id}"${route !== "now" && x === b ? ' aria-current="page"' : ""}>${esc(x.name)}</a>`)].join("");

  let strip = cur ? stripHTML(cur) : "";
  if (b) {
    const wks = weeksWithData(b);
    if (wks.length) strip += `<nav class="weeks" aria-label="Weeks" style="margin-top:12px">${wks.map(k => `<a class="pill" href="#${b.id}/w${k}"${route === "week" && k === n ? ' aria-current="page"' : ""}>Week ${k}</a>`).join("")}</nav>`;
  }
  $("strip").innerHTML = strip;

  const view = $("view");
  view.innerHTML = route === "now" ? viewNow() : route === "week" ? viewWeek(b, n) : viewBlock(b);
  if (S.after) S.after(view);
  drawYears(view);
  drawChart(view.querySelector("#chart"));
  if (route !== "now") window.scrollTo({ top: 0 });
}

$("today-pill").textContent = fmt(TODAY, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
load().then(() => {
  const lastLog = S.log.map(e => e.date).sort().pop();
  $("foot").innerHTML = `<span>Live from the repo · wiki is the source</span><span>Log to ${lastLog ? dm(lastLog) + " " + lastLog.slice(0, 4) : "—"} · Strava export to ${S.csvTo ? dm(S.csvTo) + " " + S.csvTo.slice(0, 4) : "—"}</span>`;
  render();
  addEventListener("hashchange", render);
}).catch(err => {
  $("view").innerHTML = `<section class="glass"><p class="q">Couldn't read the wiki.</p><div class="empty">${esc(err.message)}. The page reads the repo's markdown, so open it from GitHub Pages or a local server at the repo root (python3 -m http.server), not as a file.</div></section>`;
});
</script>
